version: '3.8'

services:
  mongodb:
    image: mongo:4.4
    container_name: mongodb
    restart: always
    volumes:
      - docker_mongo_data:/data/db
    # This command automatically starts MongoDB with replication enabled
    command: mongod --oplogSize 128 --replSet rs0

  # This helper container initializes the replica set automatically
  mongodb-init-replica:
    image: mongo:4.4
    container_name: mongodb-init-replica
    command: >
      bash -c "
      until mongo --host mongodb:27017 --eval 'printjson(rs.isMaster())' &>/dev/null; do
        echo 'Waiting for MongoDB to start...'
        sleep 1
      done
      echo 'Initializing Replica Set...'
      mongo --host mongodb:27017 --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]})'
      "
    depends_on:
      - mongodb

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:5.4.10
    container_name: rocketchat
    restart: always
    environment:
      - MONGO_URL=mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      - MONGO_OPLOG_URL=mongodb://mongodb:27017/local?replicaSet=rs0
      - ROOT_URL=http://localhost:3000
      - PORT=3000
    ports:
      - 3000:3000
    depends_on:
      - mongodb

volumes:
  docker_mongo_data:

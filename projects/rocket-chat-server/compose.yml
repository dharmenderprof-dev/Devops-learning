version: '3.8'

services:
  mongodb:
    image: mongo:4.4
    container_name: mongodb
    restart: always
    volumes:
      - docker_mongo_data:/data/db
    # This configures mongo to start up as a single-node replica set named rs0
    command: mongod --oplogSize 128 --replSet rs0

  mongodb-init-replica:
    image: mongo:4.4
    container_name: mongodb-init-replica
    depends_on:
      - mongodb
    # This loop waits until mongodb is explicitly up and pingable before running rs.initiate()
    command: >
      bash -c "
        echo 'Waiting for MongoDB to accept connections...';
        until mongo --host mongodb:27017 --eval 'db.runCommand({ping:1})' &>/dev/null; do
          sleep 2;
        done;
        echo 'MongoDB is up! Initializing replica set...';
        mongo --host mongodb:27017 --eval \"
          try {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]});
            print('REPLICA SET INITIALIZED SUCCESSFULLY');
          } catch(e) {
            print('Replica set already initialized:', e);
          }
        \";
      "

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:5.4.10
    container_name: rocketchat
    restart: always
    environment:
      - MONGO_URL=mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      - MONGO_OPLOG_URL=mongodb://mongodb:27017/local?replicaSet=rs0
      - ROOT_URL=http://localhost:3000
      - PORT=3000
    ports:
      - 3000:3000
    depends_on:
      - mongodb

volumes:
  docker_mongo_data:
